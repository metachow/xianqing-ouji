# Page structure of volume 1 (PKU copy, IA 02097225.cn): scan number -> layout.
# side a = recto (版心 on the left, fore-edge), b = verso (版心 on the right), from tools/detect_sides.py.
# juan/leaf = what the 版心 shows (a page file can override it with @版心).
# 圈點: each layout's `marks:` says which set is drawn on the main text --
#   transcribed (default): the marks in text/v1 (序、總目、凡例: transcribed and proofread);
#   wikisource: 句讀 from the punctuated Wikisource text (text/marks_wikisource.tsv, made by
#   tools/wiki_punct.py). The transcription keeps its own (unverified) marks for 卷一 all the same.
show_marks: true

layouts:
  preface:            # 余懷序, written-out script: 5 columns of 12
    cols: 5
    rows: 12
    font: kai
    size: 0.86        # glyph size as a fraction of the row pitch
    indent: 0
    marks: transcribed
  toc:                # 總目 and 卷一目次
    cols: 9
    rows: 20
    font: song
    size: 0.80
    indent: 0
    note_pitch: 1.0   # double-line notes: rows per small character
    note_size: 0.70   # small glyph / full glyph
  fanli:              # 凡例七則: 8 columns of 18
    cols: 8
    rows: 18
    font: song
    size: 0.80
    indent: 0
    note_pitch: 1.0
    note_size: 0.70
  body:               # 卷一 ff.: 部 heading at row 0, section heading at row 1, text at row 3
    cols: 9
    rows: 20
    font: songT       # condensed (tall, narrow) like the Kangxi 宋體
    size: 0.90
    indent: 3
    note_pitch: 1.0   # 066: six small characters fill six rows
    note_size: 0.70
    marks: wikisource # 句讀 only, for readability; the cut 圈點 (密圈 etc.) are not drawn yet

